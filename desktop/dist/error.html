<h2>🛡️ HomeSentry couldn't start its engine</h2>
<p>The background scanner exited before it was ready. The reason is in
<code>~/Library/Logs/com.vsletten.homesentry/backend.log</code>.</p>
<p>Quit HomeSentry from the menu bar and open it again. If it keeps happening, that log is
the thing to look at.</p>
